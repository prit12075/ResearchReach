<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ResearchReach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='design_system.css') }}?v=3.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='animations.css') }}?v=3.0" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #1B2B5E;
      --accent: #E8923A;
      --foreground: #0F172A;
      --muted: #64748B;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0F172A;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        position: relative;
    }

    /* Background image with overlay */
    .bg-overlay {
        position: absolute;
        inset: 0;
        background: url("{{ url_for('static', filename='login_bg.png') }}") no-repeat center center;
        background-size: cover;
        opacity: 0.6;
        z-index: 1;
    }

    .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, rgba(15, 23, 42, 0.8) 100%);
        z-index: 2;
    }

    .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 460px;
        padding: 1rem;
    }

    .login-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border-radius: 2rem;
        padding: 3rem 2.5rem;
        text-align: center;
    }

    .login-logo {
        width: 4rem;
        height: 4rem;
        background: var(--primary);
        border-radius: 1.15rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        margin: 0 auto 1.5rem auto;
        box-shadow: 0 10px 20px rgba(27, 43, 94, 0.3);
    }

    .login-title {
        font-family: 'Outfit', sans-serif;
        font-size: 2.25rem;
        font-weight: 800;
        color: var(--foreground);
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.03em;
    }

    .login-subtitle {
        color: var(--muted);
        font-size: 1rem;
        margin-bottom: 2.5rem;
        line-height: 1.5;
    }

    .auth-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        width: 100%;
        padding: 1rem;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 1rem;
        background: white;
        color: var(--foreground);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        margin-bottom: 1rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .auth-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
        border-color: var(--primary);
    }

    .auth-button svg, .auth-button i {
        width: 1.25rem;
        height: 1.25rem;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        margin: 1.5rem 0;
    }

    .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(0,0,0,0.1);
    }

    .footer-text {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 2rem;
        opacity: 0.8;
    }
  </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="bg-gradient"></div>
    
    <div class="login-container">
        <div class="login-card animate-fade-up">
            <div class="login-logo">
                <i data-lucide="graduation-cap" style="width:2.25rem; height:2.25rem;"></i>
            </div>
            <h1 class="login-title">ResearchReach</h1>
            <p class="login-subtitle">Connect with your future research supervisor through AI-driven matching.</p>

            <form id="login-form" method="POST" action="/login">
                <button type="submit" class="auth-button" id="google-btn">
                    <svg id="google-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <i data-lucide="loader-2" class="hidden animate-spin" id="google-spinner"></i>
                    <span id="google-text">Continue with Google</span>
                </button>
                
                <div class="divider">or</div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <button type="submit" class="auth-button" style="margin-bottom:0;">
                        <i data-lucide="mail"></i>
                        Email
                    </button>
                    <button type="submit" class="auth-button" style="margin-bottom:0;">
                        <i data-lucide="github"></i>
                        GitHub
                    </button>
                </div>
            </form>

            <p class="footer-text">
                By continuing, you agree to our Terms of Service and Privacy Policy. This is a secure academic environment.
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('google-btn');
            const icon = document.getElementById('google-icon');
            const spinner = document.getElementById('google-spinner');
            const text = document.getElementById('google-text');
            
            icon.classList.add('hidden');
            spinner.classList.remove('hidden');
            text.innerText = "Authenticating...";
            btn.style.pointerEvents = "none";
            
            setTimeout(() => {
                this.submit();
            }, 1200);
        });
    </script>
</body>
</html>
